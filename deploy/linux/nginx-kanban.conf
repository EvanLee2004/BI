# 甲骨易经营看板 · nginx 生产标准架构（Ubuntu 26.04 · 任务书50·D / 43 方案 B / 2.7.3 维护页）
# 用法见 docs/Ubuntu部署手册.md：
#   sudo cp deploy/linux/nginx-kanban.conf /etc/nginx/sites-available/kanban
#   改 root / proxy 路径后：sudo ln -sf .../kanban /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 生产标准（双进程）：
#   :80  → 本文件：frontend/dist 静态（immutable）+ index.html no-store
#         + /api/* /admin /bu /login 反代 127.0.0.1:8018
#   :8018 → uvicorn 仅回环（server_host=127.0.0.1 / serve_static=false）
# 简易模式（开发机/Windows）：run.py --serve 单进程自带 dist+API，见 MADR-0009
#
# 选型：发行版 nginx（apt install nginx），不自写反代。
#
# 注意：nginx 子 location 一旦写了 add_header，不会继承 server 级 add_header；
# 凡带 Cache-Control 的 location 必须重复安全头（任务书64·D8）。
#
# 2.7.3 维护页：
#   - 标志文件 数据/maintenance.flag 存在时，页面入口返回维护 HTML（no-store）
#   - 上游 502/504 时页面入口 error_page → 维护 HTML（双保险）
#   - /api/ 禁止 proxy_intercept_errors（JSON 503 不得被 HTML 劫持）
#   - 导出已迁 /api/v1/export/*（html/png/pl.xlsx）；下方 export.(png|html) 为历史兼容注释保留反代
# 上机必做（禁止只 git pull）：cp 本 conf → nginx -t → reload
#
# 3.7.3 蓝绿：upstream 抽到同目录 kanban_upstream.inc，publish 可改端口后 nginx -t && reload。
# 安装时须保证 include 路径存在（仓库内默认 8018）。

include /opt/kanban/看板正式程序/deploy/linux/kanban_upstream.inc;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # 任务书64·D8：不暴露 nginx 版本；基础安全头
    # X-Frame-Options 必须 SAMEORIGIN（管理端「看」iframe 嵌 /；DENY 会空白）
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vue 构建产物（安装时 sed 替换为真实绝对路径）
    root /opt/kanban/看板正式程序/frontend/dist;
    client_max_body_size 32m;

    # gzip 由 nginx 做（后端 GZipMiddleware 仅简易单进程模式仍开）
    gzip on;
    gzip_types text/css application/javascript application/json text/html application/xml image/svg+xml;
    gzip_min_length 1000;

    # 2.7.3：维护页本体（alias + no-store）；也可被 error_page 内部跳转
    location = /maintenance.html {
        alias /opt/kanban/看板正式程序/static/maintenance.html;
        default_type text/html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 命名 location：flag / 502 / 504 → 维护 HTML（仅页面类 location 引用）
    location @maint {
        internal;
        root /opt/kanban/看板正式程序/static;
        try_files /maintenance.html =503;
        default_type text/html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # —— API：只反代，禁止 proxy_intercept_errors（避免 JSON 被维护 HTML 劫持）——
    # 覆盖 /api/v1/* 业务、健康、导出 /api/v1/export.html|png|pl.xlsx 等
    location ~ ^/api(/|$) {
        proxy_pass http://kanban_api;
        proxy_http_version 1.1;
        # S-13：$http_host 保留非默认端口（如 :8001）；$host 会丢端口导致 CSRF origin_mismatch
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        # 禁止对本 location 开启 intercept（避免 JSON 被 HTML 替换）；无 if flag
    }

    # —— 页面类动态入口：admin / login / bu；flag 或上游 502/504 → 维护页 ——
    # 正则保留 api|admin|login|bu 字样供契约检索（api 已由上方独立 location 处理）
    # 历史：location ~ ^/(api|admin|login|bu|export\.(png|html))(/|$)
    location ~ ^/(admin|login|bu)(/|$) {
        # if 仅用于 flag 文件存在性（2.7.3 文档约定）
        if (-f /opt/kanban/看板正式程序/数据/maintenance.flag) {
            return 503;
        }
        error_page 503 502 504 = @maint;
        proxy_intercept_errors on;
        proxy_pass http://kanban_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # 历史兼容：裸 export.html / export.png（产品主路径已是 /api/v1/export/*；裸路径后端 404）
    location ~ ^/export\.(png|html)(/|$) {
        proxy_pass http://kanban_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # 指纹资产长缓存
    location /app/assets/ {
        alias /opt/kanban/看板正式程序/frontend/dist/assets/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # legacy static（theme.css 等）
    location /static/ {
        alias /opt/kanban/看板正式程序/static/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 2.4.3：根路径必须反代后端（GET / 对纯 BU 303→/bu/xxx）。
    # 禁止 try_files /index.html：dist 有 index 时会绕过鉴权跳转，前端再打 cockpit 403 空壳。
    # 2.7.3：flag 或上游 502/504 → 维护页；仍须 proxy_pass（铁律）
    location = / {
        # 安全头须在块内靠前（子 location 不继承 server 级 add_header；测例截前 450 字）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        if (-f /opt/kanban/看板正式程序/数据/maintenance.flag) {
            return 503;
        }
        error_page 503 502 504 = @maint;
        proxy_intercept_errors on;
        proxy_pass http://kanban_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其它前端路由仍走 dist SPA；API/login/bu/admin 已在上方 location 反代
    location / {
        if (-f /opt/kanban/看板正式程序/数据/maintenance.flag) {
            return 503;
        }
        error_page 503 = @maint;
        try_files $uri $uri/ /index.html @backend;
    }

    location @backend {
        proxy_pass http://kanban_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }
}
